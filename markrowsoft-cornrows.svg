<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="MarkRowSoft corn rows">
  <title>MarkRowSoft fall corn rows</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e6c8"/>
      <stop offset="55%" stop-color="#e8c48a"/>
      <stop offset="100%" stop-color="#c47a3a"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a1e"/>
      <stop offset="100%" stop-color="#3d2a12"/>
    </linearGradient>
    <g id="ear">
      <rect x="0" y="8" width="36" height="42" rx="3" fill="#2a2a2a"/>
      <rect x="0" y="8" width="36" height="8" rx="3" fill="#1a1a1a"/>
      <circle cx="6" cy="12" r="1.2" fill="#8a8a8a"/>
      <circle cx="10" cy="12" r="1.2" fill="#8a8a8a"/>
      <circle cx="14" cy="12" r="1.2" fill="#8a8a8a"/>
      <text x="18" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700" font-size="18" fill="#f7f7f4">R</text>
      <rect x="38" y="8" width="36" height="42" rx="3" fill="#1f4d3a"/>
      <rect x="38" y="8" width="36" height="8" rx="3" fill="#16382b"/>
      <circle cx="44" cy="12" r="1.2" fill="#8fbfa8"/>
      <circle cx="48" cy="12" r="1.2" fill="#8fbfa8"/>
      <circle cx="52" cy="12" r="1.2" fill="#8fbfa8"/>
      <text x="56" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700" font-size="18" fill="#f7f7f4">O</text>
      <rect x="76" y="8" width="36" height="42" rx="3" fill="#2a2a2a"/>
      <rect x="76" y="8" width="36" height="8" rx="3" fill="#1a1a1a"/>
      <circle cx="82" cy="12" r="1.2" fill="#8a8a8a"/>
      <circle cx="86" cy="12" r="1.2" fill="#8a8a8a"/>
      <circle cx="90" cy="12" r="1.2" fill="#8a8a8a"/>
      <text x="94" y="36" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700" font-size="18" fill="#f7f7f4">W</text>
    </g>
    <g id="stalk">
      <rect x="54" y="0" width="6" height="420" rx="2" fill="#3f6b2a"/>
      <use href="#ear" x="0" y="20"/>
      <use href="#ear" x="0" y="78"/>
      <use href="#ear" x="0" y="136"/>
      <use href="#ear" x="0" y="194"/>
      <use href="#ear" x="0" y="252"/>
      <use href="#ear" x="0" y="310"/>
