  <rect width="960" height="540" fill="url(#sky)"/>
  <rect y="430" width="960" height="110" fill="url(#field)"/>
  <g opacity="0.95">
    <use href="#stalk" x="20" y="40"/>
    <use href="#stalk" x="170" y="10"/>
    <use href="#stalk" x="320" y="48"/>
    <use href="#stalk" x="470" y="8"/>
    <use href="#stalk" x="620" y="36"/>
    <use href="#stalk" x="770" y="16"/>
  </g>
</svg>
